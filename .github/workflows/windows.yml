name: Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer as v0.4.0
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.14.2
      - name: Test Qt interaction
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          PYTHONPATH: .
        run: python tests/ui_smoke.py
      - name: Render Windows icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build_icon.py
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --windowed --name DesktopRestore --icon app-icon.ico --hidden-import PySide6.QtSvg --add-data "Main.qml:." --add-data "app-icon.svg:." app.py
      - name: Check the bundled application starts
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $process = Start-Process -FilePath .\dist\DesktopRestore\DesktopRestore.exe -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw 'The desktop application did not exit after its startup check.'
          }
          if ($process.ExitCode -ne 0) { throw "Desktop startup failed: $($process.ExitCode)" }
      - name: Include third-party licenses
        run: |
          $folder = New-Item -ItemType Directory -Force -Path .\dist\DesktopRestore\Licenses
          $qt = 'https://raw.githubusercontent.com/qt/qtbase/v6.8.3/LICENSES'
          foreach ($file in @('LGPL-3.0-only.txt', 'GPL-3.0-only.txt')) {
            Invoke-WebRequest "$qt/$file" -OutFile (Join-Path $folder.FullName $file)
          }
          $pythonHome = python -c "import sys; print(sys.base_prefix)"
          Copy-Item (Join-Path $pythonHome 'LICENSE.txt') (Join-Path $folder.FullName 'Python.txt')
          Copy-Item ThirdParty.txt $folder.FullName
      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { & $iscc "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" setup.iss }
          else { & $iscc setup.iss }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installation, upgrade and shortcuts
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'DesktopRestore-InstallTest'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', ('/DIR="' + $destination + '"'))
          $old = Join-Path $env:RUNNER_TEMP 'DesktopRestore-v03-Setup.exe'
          $oldUrl = 'https://github.com/mihailmoskalenko08-eng/desktop-restore/releases/download/v0.3.0/DesktopRestore-Setup.exe'
          Invoke-WebRequest $oldUrl -OutFile $old
          $previous = Start-Process -FilePath $old -ArgumentList $arguments -Wait -PassThru
          if ($previous.ExitCode -ne 0) { throw "Previous installation failed: $($previous.ExitCode)" }
          $config = Join-Path $env:LOCALAPPDATA 'DesktopRestore'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          $data = Join-Path $config 'workspaces.json'
          '{"version":1,"selected":"legacy","groups":[{"id":"legacy","name":"Legacy workspace","items":[],"topics":[]}]}' | Set-Content -Path $data -Encoding utf8NoBOM
          $hash = (Get-FileHash $data).Hash
          $installer = Start-Process -FilePath .\dist\DesktopRestore-Setup.exe -ArgumentList $arguments -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Upgrade failed: $($installer.ExitCode)" }
          if ((Get-FileHash $data).Hash -ne $hash) { throw 'Upgrade altered the workspace data.' }
          $icon = Join-Path $destination 'DesktopRestore-v04.ico'
          if (!(Test-Path $icon)) { throw 'Custom icon was not installed.' }
          $link = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Верни рабочий стол.lnk'
          if (!(Test-Path $link)) { throw 'Desktop shortcut was not created.' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if (($shortcut.IconLocation -split ',')[0] -ne $icon) { throw "Incorrect shortcut icon: $($shortcut.IconLocation)" }
          if ($shortcut.TargetPath -ne (Join-Path $destination 'DesktopRestore.exe')) { throw 'Desktop shortcut missing its target.' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $app = Start-Process -FilePath (Join-Path $destination 'DesktopRestore.exe') -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(30000)) {
            Stop-Process -Id $app.Id -Force
            throw 'The installed app did not exit after its startup check.'
          }
          if ($app.ExitCode -ne 0) { throw "Installed startup failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopRestore-Setup
          path: dist/DesktopRestore-Setup.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DesktopRestore-Setup
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" DesktopRestore-Setup.exe --verify-tag --generate-notes
          else
            gh release create v0.4.0 DesktopRestore-Setup.exe --target "$GITHUB_SHA" --generate-notes
          fi
